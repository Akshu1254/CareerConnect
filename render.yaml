services:
  - type: web
    name: careerconnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://akshu1254.github.io
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
